<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Look | تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#12804f;--g2:#0e6a42;--bg:#f7faf9;--card:#fff;--ink:#14201b;--mut:#6b7a73;--line:#d9e4df;--err:#c0392b;--field:#f1f6f3}
@media (prefers-color-scheme:dark){:root{--bg:#0d1411;--card:#15201b;--ink:#eef5f1;--mut:#93a39a;--line:#26342d;--field:#1b2923}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Cairo",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center;align-items:center;padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0)}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 22px 22px;text-align:center}
.card.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
#bear{width:150px;height:150px;border-radius:50%;display:block;margin:0 auto 10px}
#bear.hop{animation:hop .6s}
@keyframes hop{30%{transform:translateY(-14px)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
h1{font-size:23px;font-weight:800}
.sub{color:var(--mut);font-size:13px;margin:2px 0 16px}
label{display:block;text-align:right;font-size:13px;font-weight:600;margin:10px 0 5px}
.f{position:relative}
input{width:100%;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:15px;padding:0 14px;direction:ltr;text-align:left;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(18,128,79,.15)}
input.bad{border-color:var(--err);background:rgba(192,57,43,.07)}
#eye{position:absolute;left:6px;top:3px;width:40px;height:40px;border:0;background:none;color:var(--mut);cursor:pointer;font-size:18px}
#pw{padding-left:44px}
.btn{width:100%;height:48px;margin-top:16px;border:0;border-radius:12px;background:var(--g);color:#fff;font:inherit;font-size:16px;font-weight:800;cursor:pointer;transition:background .2s,transform .1s}
.btn:hover{background:var(--g2)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6;cursor:wait}
.msg{min-height:20px;margin-top:10px;font-size:13px;font-weight:600}
.msg.err{color:var(--err)}.msg.ok{color:var(--g)}
.links{display:flex;justify-content:space-between;margin-top:6px;font-size:13px}
.links button{background:none;border:0;color:var(--g);font:inherit;font-weight:600;cursor:pointer}
.hide{display:none!important}
.home{padding:30px 22px}
.home .ok{font-size:46px}
.home .mail{direction:ltr;color:var(--mut);margin:6px 0 20px;word-break:break-all}
.sec{background:var(--field);color:var(--ink);border:1px solid var(--line)}
/* الدب */
.paws{transform:translateY(100px);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
#bear[data-s=hide] .paws{transform:translateY(0)}
#bear[data-s=peek] .paws{transform:translateY(44px)}
#eyes{transition:transform .15s ease-out}
.m{display:none}.m-idle{display:inline}
#bear[data-s=sad] .m-idle,#bear[data-s=happy] .m-idle{display:none}
#bear[data-s=sad] .m-sad,#bear[data-s=happy] .m-happy{display:inline}
.tear,.happy-eyes{display:none}
#bear[data-s=sad] .tear{display:inline;animation:tear 1.2s infinite}
#bear[data-s=happy] .happy-eyes{display:inline}
#bear[data-s=happy] #eyes{display:none}
@keyframes tear{from{transform:translateY(-3px);opacity:1}to{transform:translateY(12px);opacity:.2}}
.brow{transition:transform .25s;transform-box:fill-box;transform-origin:center}
#bear[data-s=sad] .bl{transform:rotate(-18deg)}#bear[data-s=sad] .br{transform:rotate(18deg)}
#bear[data-s=happy] .brow{transform:translateY(-5px)}
</style>
</head>
<body>

<main class="card" id="card">
  <section id="auth">
    <svg id="bear" viewBox="0 0 200 200" data-s="idle" aria-hidden="true">
      <defs><clipPath id="cl"><circle cx="100" cy="100" r="100"/></clipPath></defs>
      <g clip-path="url(#cl)">
        <circle cx="100" cy="100" r="100" fill="#d9e4ea"/>
        <path d="M25 205Q35 150 100 148Q165 150 175 205Z" fill="#fff"/>
        <circle cx="54" cy="58" r="19" fill="#fff" stroke="#c9d6de" stroke-width="2"/><circle cx="54" cy="58" r="9" fill="#e7b9c3"/>
        <circle cx="146" cy="58" r="19" fill="#fff" stroke="#c9d6de" stroke-width="2"/><circle cx="146" cy="58" r="9" fill="#e7b9c3"/>
        <ellipse cx="100" cy="104" rx="64" ry="54" fill="#fff" stroke="#c9d6de" stroke-width="2"/>
        <ellipse cx="100" cy="128" rx="28" ry="21" fill="#eef3f6"/>
        <ellipse cx="100" cy="117" rx="10" ry="6.5" fill="#3a2f35"/>
        <g class="m m-idle"><path d="M89 134Q100 143 111 134" stroke="#3a2f35" stroke-width="3" fill="none" stroke-linecap="round"/></g>
        <g class="m m-sad"><path d="M89 140Q100 129 111 140" stroke="#3a2f35" stroke-width="3" fill="none" stroke-linecap="round"/></g>
        <g class="m m-happy"><path d="M86 130Q100 156 114 130Z" fill="#8a2f45" stroke="#3a2f35" stroke-width="3" stroke-linejoin="round"/></g>
        <g id="eyes"><circle cx="72" cy="100" r="8.5" fill="#2b2428"/><circle cx="128" cy="100" r="8.5" fill="#2b2428"/><circle cx="75" cy="97" r="2.6" fill="#fff"/><circle cx="131" cy="97" r="2.6" fill="#fff"/></g>
        <g class="happy-eyes" stroke="#2b2428" stroke-width="4" fill="none" stroke-linecap="round"><path d="M62 102Q72 90 82 102"/><path d="M118 102Q128 90 138 102"/></g>
        <path class="brow bl" d="M60 82H84" stroke="#9fb0ba" stroke-width="4" stroke-linecap="round"/>
        <path class="brow br" d="M116 82H140" stroke="#9fb0ba" stroke-width="4" stroke-linecap="round"/>
        <ellipse class="tear" cx="84" cy="114" rx="3" ry="5" fill="#7fc4ee"/>
        <path d="M52 150Q100 176 148 150L154 168Q100 194 46 168Z" fill="#b8324f"/>
        <path d="M122 168L138 204L154 198L142 164Z" fill="#9c2a43"/>
        <g class="paws" stroke="#c9d6de" stroke-width="2"><ellipse cx="70" cy="108" rx="23" ry="18" fill="#fff"/><ellipse cx="130" cy="108" rx="23" ry="18" fill="#fff"/></g>
      </g>
    </svg>

    <h1 id="title">مرحبًا بعودتك</h1>
    <p class="sub" id="sub">سجّل دخولك بالبريد الإلكتروني</p>

    <form id="form" novalidate>
      <label for="em">البريد الإلكتروني</label>
      <input id="em" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com">
      <label for="pw">كلمة السر</label>
      <div class="f">
        <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
        <button type="button" id="eye" aria-label="إظهار كلمة السر">👁</button>
      </div>
      <button class="btn" id="go" type="submit">دخول</button>
      <div class="msg" id="msg" role="status"></div>
      <div class="links">
        <button type="button" id="forgot">نسيت كلمة السر؟</button>
        <button type="button" id="swap">إنشاء حساب جديد</button>
      </div>
    </form>
  </section>

  <section id="home" class="home hide">
    <div class="ok">✅</div>
    <h1>تم تسجيل الدخول بنجاح</h1>
    <p class="mail" id="who"></p>
    <button class="btn sec" id="out" type="button">تسجيل الخروج</button>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
         sendPasswordResetEmail, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyCOR3tff0miUAmuKQlRYnGKuUoxxfsuAtQ",
  authDomain: "onelook-app.firebaseapp.com",
  projectId: "onelook-app",
  storageBucket: "onelook-app.firebasestorage.app",
  messagingSenderId: "126184543237",
  appId: "1:126184543237:web:48186caf2f7efaf13c786c"
});
const auth = getAuth(app);

const $ = (id) => document.getElementById(id);
const bear = $("bear"), eyes = $("eyes"), em = $("em"), pw = $("pw"), msg = $("msg"), go = $("go");
let signup = false, hold = false;

/* ===== الدب ===== */
const setBear = (s) => (bear.dataset.s = s);
function gaze(inp) {
  const r = Math.min(inp.value.length, 26) / 26;
  eyes.style.transform = `translate(${(r * 2 - 1) * 5}px, 3.5px)`;
}
em.addEventListener("focus", () => { setBear("look"); gaze(em); });
em.addEventListener("input", () => { setBear("look"); gaze(em); clearErr(); });
em.addEventListener("blur", () => { if (bear.dataset.s === "look") { setBear("idle"); eyes.style.transform = ""; } });
const pwState = () => (pw.type === "text" ? (gaze(pw), "look") : "hide");
pw.addEventListener("focus", () => setBear(pwState()));
pw.addEventListener("input", () => { setBear(pwState()); clearErr(); });
pw.addEventListener("blur", () => { setBear("idle"); eyes.style.transform = ""; });
$("eye").addEventListener("click", () => {
  pw.type = pw.type === "password" ? "text" : "password";
  $("eye").textContent = pw.type === "text" ? "🙈" : "👁";
  setBear(pw.type === "text" ? "peek" : (document.activeElement === pw ? "hide" : "idle"));
  if (pw.type === "text") gaze(pw);
});

/* ===== الرسائل ===== */
function clearErr() { msg.textContent = ""; msg.className = "msg"; em.classList.remove("bad"); pw.classList.remove("bad"); }
function fail(text, ...inputs) {
  msg.textContent = text; msg.className = "msg err";
  inputs.forEach((i) => i.classList.add("bad"));
  setBear("sad"); eyes.style.transform = "";
  $("card").classList.remove("shake"); void $("card").offsetWidth; $("card").classList.add("shake");
}
const ERR = {
  "auth/invalid-credential": "البريد الإلكتروني أو كلمة السر غير صحيحة",
  "auth/wrong-password": "كلمة السر غير صحيحة",
  "auth/user-not-found": "لا يوجد حساب بهذا البريد",
  "auth/invalid-email": "صيغة البريد الإلكتروني غير صحيحة",
  "auth/email-already-in-use": "هذا البريد مسجّل مسبقاً، جرّب تسجيل الدخول",
  "auth/weak-password": "كلمة السر ضعيفة، استخدم 6 أحرف على الأقل",
  "auth/too-many-requests": "محاولات كثيرة، انتظر قليلاً ثم أعد المحاولة",
  "auth/network-request-failed": "تعذّر الاتصال بالإنترنت",
  "auth/operation-not-allowed": "فعّل تسجيل الدخول بالبريد وكلمة السر من Firebase Console",
  "auth/unauthorized-domain": "أضف هذا النطاق إلى Authorized domains في Firebase"
};
const errText = (e) => ERR[e.code] || "حدث خطأ غير متوقع (" + (e.code || e.message) + ")";

/* ===== تبديل الوضع ===== */
function setMode(s) {
  signup = s; clearErr();
  $("title").textContent = s ? "أنشئ حسابك" : "مرحبًا بعودتك";
  $("sub").textContent = s ? "ابدأ رحلتك مع One Look" : "سجّل دخولك بالبريد الإلكتروني";
  go.textContent = s ? "إنشاء حساب" : "دخول";
  $("swap").textContent = s ? "لدي حساب بالفعل" : "إنشاء حساب جديد";
  $("forgot").classList.toggle("hide", s);
  pw.autocomplete = s ? "new-password" : "current-password";
}
$("swap").addEventListener("click", () => setMode(!signup));

/* ===== الدخول والتسجيل ===== */
$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault(); clearErr();
  const email = em.value.trim(), pass = pw.value;
  if (!email) return fail("اكتب بريدك الإلكتروني", em);
  if (!pass) return fail("اكتب كلمة السر", pw);
  go.disabled = true; const old = go.textContent; go.textContent = "جارٍ التحقق...";
  hold = true;
  try {
    if (signup) await createUserWithEmailAndPassword(auth, email, pass);
    else await signInWithEmailAndPassword(auth, email, pass);
    setBear("happy"); bear.classList.add("hop");
    msg.textContent = signup ? "تم إنشاء الحساب بنجاح" : "تم تسجيل الدخول بنجاح"; msg.className = "msg ok";
    setTimeout(() => { hold = false; render(auth.currentUser); }, 1100);
  } catch (e) {
    hold = false;
    const bad = /password|credential/.test(e.code) ? [pw] : /email|user/.test(e.code) ? [em] : [];
    fail(errText(e), ...bad);
  } finally { go.disabled = false; go.textContent = old; }
});

$("forgot").addEventListener("click", async () => {
  clearErr();
  const email = em.value.trim();
  if (!email) return fail("اكتب بريدك أولاً ثم اضغط «نسيت كلمة السر»", em);
  try { await sendPasswordResetEmail(auth, email); msg.textContent = "أرسلنا رابط إعادة التعيين إلى بريدك"; msg.className = "msg ok"; }
  catch (e) { fail(errText(e), em); }
});

/* ===== الحالة ===== */
function render(user) {
  $("auth").classList.toggle("hide", !!user);
  $("home").classList.toggle("hide", !user);
  if (user) $("who").textContent = user.email;
  else { bear.classList.remove("hop"); setBear("idle"); pw.value = ""; clearErr(); }
}
onAuthStateChanged(auth, (u) => { if (!hold) render(u); });
$("out").addEventListener("click", () => signOut(auth));
</script>
</body>
</html>
