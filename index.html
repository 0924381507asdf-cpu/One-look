<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>One Look</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--r:#fe2c55;--c:#25f4ee;--bg:#000;--p:#121212;--l:#2a2a2a;--m:#9a9a9a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:#fff;font-family:Cairo,Tahoma,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hide{display:none!important}
.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--r),#7b2ff7);display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}
/* دخول */
#auth{height:100%;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.box{width:100%;max-width:380px;background:var(--p);border:1px solid var(--l);border-radius:24px;padding:22px;text-align:center}
.box.sh{animation:sh .45s}@keyframes sh{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
#bear{width:140px;height:140px;border-radius:50%;display:block;margin:0 auto 8px}
#bear.hop{animation:hp .6s}@keyframes hp{30%{transform:translateY(-14px)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
h1{font-size:22px;font-weight:800}.sub{color:var(--m);font-size:13px;margin:2px 0 12px}
label{display:block;text-align:right;font-size:13px;font-weight:600;margin:9px 0 4px}
input,textarea{width:100%;border-radius:12px;border:1.5px solid var(--l);background:#1c1c1c;color:#fff;font:inherit;font-size:15px;padding:11px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--c)}input.bad{border-color:var(--r)}
.ltr{direction:ltr;text-align:left}.f{position:relative}.f button{position:absolute;left:8px;top:8px;color:var(--m)}.f input{padding-left:44px}
.btn{width:100%;height:46px;margin-top:14px;border-radius:12px;background:var(--r);font-weight:800;font-size:16px}.btn:disabled{opacity:.6}
.msg{min-height:20px;margin-top:8px;font-size:13px;font-weight:600;color:var(--r)}.msg.ok{color:var(--c)}
.lk2{display:flex;justify-content:space-between;font-size:13px;margin-top:4px}.lk2 button{color:var(--c);font-weight:600}
.paws{transform:translateY(100px);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
#bear[data-s=hide] .paws{transform:none}#bear[data-s=peek] .paws{transform:translateY(44px)}
#eyes{transition:transform .15s}.m,.tear,.he{display:none}.m1{display:inline}
#bear[data-s=sad] .m1,#bear[data-s=happy] .m1{display:none}#bear[data-s=sad] .m2,#bear[data-s=happy] .m3,#bear[data-s=happy] .he{display:inline}
#bear[data-s=sad] .tear{display:inline;animation:td 1.2s infinite}#bear[data-s=happy] #eyes{display:none}
@keyframes td{from{transform:translateY(-3px)}to{transform:translateY(12px);opacity:.2}}
.br{transition:transform .25s;transform-box:fill-box;transform-origin:center}
#bear[data-s=sad] .b1{transform:rotate(-18deg)}#bear[data-s=sad] .b2{transform:rotate(18deg)}#bear[data-s=happy] .br{transform:translateY(-5px)}
/* التطبيق */
#app{height:100%;display:flex;flex-direction:column}
main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto}
#feed{scroll-snap-type:y mandatory;overscroll-behavior:contain}
.post{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:#000;overflow:hidden}
.post video,.post img.md{width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:auto 0 0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.75));pointer-events:none}
.side{position:absolute;left:10px;bottom:20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.side button{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:600;text-shadow:0 1px 3px #000}
.side .ic{width:34px;height:34px;filter:drop-shadow(0 1px 3px #000)}
.side .on .ic{fill:var(--r);stroke:var(--r)}
.fa{position:relative}.fa .av{width:48px;height:48px;border:2px solid #fff}
.fa i{position:absolute;bottom:-9px;left:50%;margin-left:-10px;width:20px;height:20px;border-radius:50%;background:var(--r);display:flex;align-items:center;justify-content:center}
.fa i .ic{width:13px;height:13px;stroke-width:3;filter:none}.fa.done i{display:none}
.info{position:absolute;right:14px;left:84px;bottom:18px;text-shadow:0 1px 3px #000;pointer-events:none}
.info b{font-size:16px}.info p{font-size:14px;margin-top:3px}.info small{color:var(--c);font-size:13px}
.pop{position:absolute;width:90px;height:90px;margin:-45px;fill:var(--r);stroke:var(--r);pointer-events:none;animation:pp .7s forwards}
@keyframes pp{0%{transform:scale(.3);opacity:1}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1.4);opacity:0}}
.tabs{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;gap:22px;z-index:5;font-weight:800;text-shadow:0 1px 4px #000}
.tabs button{opacity:.6;padding:4px 2px;border-bottom:3px solid transparent}.tabs .on{opacity:1;border-color:#fff}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--m);text-align:center;padding:30px}
nav{display:flex;align-items:center;justify-content:space-around;height:58px;padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:content-box;background:#000;border-top:1px solid var(--l)}
nav button{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--m);flex:1}nav .on{color:#fff}
nav .pl{flex:none;width:52px;height:34px;border-radius:10px;background:#fff;color:#000;position:relative;box-shadow:-3px 0 var(--c),3px 0 var(--r);align-items:center;justify-content:center}
.pad{padding:14px;padding-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.cell{aspect-ratio:3/4;position:relative;background:#1a1a1a;overflow:hidden}.cell video,.cell img{width:100%;height:100%;object-fit:cover}
.cell span{position:absolute;bottom:4px;right:6px;font-size:12px;display:flex;align-items:center;gap:3px;text-shadow:0 1px 3px #000}.cell .ic{width:14px;height:14px}
.pf{text-align:center;padding-top:20px}.pf .av{width:92px;height:92px;font-size:34px;border:3px solid var(--c)}
.st{display:flex;justify-content:center;gap:34px;margin:14px 0}.st b{display:block;font-size:19px;color:var(--c)}.st small{color:var(--m)}
.row{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.sm{padding:8px 16px;border-radius:10px;background:var(--l);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}.sm .ic{width:17px;height:17px}
.srch{margin:12px}
/* نوافذ */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sheet>div{width:100%;max-height:75%;background:var(--p);border-radius:20px 20px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet header{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.cl{overflow-y:auto;flex:1;min-height:90px}
.cm1{display:flex;gap:10px;margin-bottom:12px}.cm1 .av{width:34px;height:34px;font-size:14px}.cm1 b{font-size:13px;color:var(--m)}.cm1 p{font-size:14px;word-break:break-word}
.snd{display:flex;gap:8px}.snd button{width:46px;border-radius:12px;background:var(--r);display:flex;align-items:center;justify-content:center}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#222;border:1px solid var(--l);padding:9px 16px;border-radius:20px;font-size:13px;z-index:50;max-width:90%;text-align:center}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:8px;border-radius:10px;background:var(--l);font-size:13px;font-weight:600}.seg .on{background:#fff;color:#000}
.vw{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:600;text-shadow:0 1px 3px #000}.vw .ic{width:30px;height:30px;filter:drop-shadow(0 1px 3px #000)}
.pr{display:flex;align-items:center;gap:12px;padding:8px 14px;cursor:pointer}.pr b{direction:ltr}
.bk{position:absolute;top:10px;right:10px;width:40px;height:40px;z-index:2}
#user{z-index:8;background:#000}.st{gap:22px}.cell .ic{fill:#fff;stroke:none}
</style>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import{getStorage,ref,uploadBytesResumable,getDownloadURL}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
const app=initializeApp({apiKey:"AIzaSyCOR3tff0miUAmuKQlRYnGKuUoxxfsuAtQ",authDomain:"onelook-app.firebaseapp.com",projectId:"onelook-app",storageBucket:"onelook-app.firebasestorage.app",messagingSenderId:"126184543237",appId:"1:126184543237:web:48186caf2f7efaf13c786c"});
const A=getAuth(app),D=getFirestore(app),S=getStorage(app);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let ou=null,seen=new Set(),allUsers={},ul=0,mode="file",me=null,posts=[],tab="all",shown="",cur=null,hold=false,signup=false,uns=[],view="feed",last=0;

const bear=$("#bear"),eyes=$("#eyes"),em=$("#em"),pw=$("#pw"),un=$("#un"),msg=$("#msg"),go=$("#go");

[em,un].forEach(i=>{i.onfocus=i.oninput=()=>{sb("look");gaze(i);if(i.oninput)clr()};i.onblur=()=>{sb("idle");eyes.style.transform=""}});
pw.onfocus=()=>sb(ps());pw.oninput=()=>{sb(ps());clr()};pw.onblur=()=>{sb("idle");eyes.style.transform=""};
$("#eye").onclick=()=>{const t=pw.type==="password";pw.type=t?"text":"password";$("#eye use").setAttribute("href",t?"#i-eyeoff":"#i-eye");sb(t?"peek":"hide");if(t)gaze(pw)};
const fail=(t,...i)=>{msg.textContent=t;msg.className="msg";i.forEach(x=>x.classList.add("bad"));sb("sad");eyes.style.transform="";const b=$("#box");b.classList.remove("sh");void b.offsetWidth;b.classList.add("sh")};
$("#sw").onclick=()=>{signup=!signup;clr();$("#unw").classList.toggle("hide",!signup);$("#ti").textContent=signup?"أنشئ حسابك":"مرحبًا بعودتك";$("#su").textContent=signup?"انضم إلى One Look":"سجّل دخولك بالبريد الإلكتروني";go.textContent=signup?"إنشاء حساب":"دخول";$("#sw").textContent=signup?"لدي حساب بالفعل":"إنشاء حساب جديد";$("#fg").classList.toggle("hide",signup)};
const clean=s=>(s||"").toLowerCase().replace(/[^a-z0-9_.]/g,"").slice(0,20);
$("#box").onsubmit=async e=>{e.preventDefault();clr();const email=em.value.trim(),pass=pw.value,name=clean(un.value);
if(signup&&name.length<3)return fail("اسم المستخدم 3 أحرف إنجليزية على الأقل",un);
if(!email)return fail("اكتب بريدك الإلكتروني",em);if(!pass)return fail("اكتب كلمة السر",pw);
go.disabled=true;const old=go.textContent;go.textContent="جارٍ التحقق...";hold=true;
try{if(signup){const c=await cu(A,email,pass);await setDoc(doc(D,"users",c.user.uid),{username:"@"+name,following:[],createdAt:serverTimestamp()})}else await si(A,email,pass);
sb("happy");bear.classList.add("hop");msg.textContent="تم بنجاح";msg.className="msg ok";setTimeout(()=>{hold=false;start(A.currentUser)},1000)}
catch(x){hold=false;fail(errs[x.code]||"خطأ غير متوقع ("+(x.code||x.message)+")",.../password|credential/.test(x.code)?[pw]:/email|user/.test(x.code)?[em]:[])}
finally{go.disabled=false;go.textContent=old}};
$("#fg").onclick=async()=>{clr();if(!em.value.trim())return fail("اكتب بريدك أولاً",em);try{await pr(A,em.value.trim());msg.textContent="أُرسل رابط إعادة التعيين إلى بريدك";msg.className="msg ok"}catch(x){fail(errs[x.code]||"تعذّر الإرسال",em)}};

/* ===== بدء التطبيق ===== */
oa(A,u=>{if(hold)return;if(u)start(u);else stop()});
function stop(){uns.forEach(f=>f());uns=[];me=null;posts=[];shown="";$("#app").classList.add("hide");$("#auth").classList.remove("hide");bear.classList.remove("hop");sb("idle");pw.value="";clr()}
function start(u){if(!u||me?.uid===u.uid)return;uns.forEach(f=>f());uns=[];shown="";
$("#auth").classList.add("hide");$("#app").classList.remove("hide");
uns.push(onSnapshot(doc(D,"users",u.uid),s=>{const d=s.data();
if(!d){setDoc(doc(D,"users",u.uid),{username:"@user_"+u.uid.slice(0,6).toLowerCase(),following:[]},{merge:true});return}
const first=!me;me={uid:u.uid,username:d.username||"@user",avatar:d.avatar||"",following:d.following||[],followers:me?.followers||0};
if(first){uns.push(onSnapshot(query(collection(D,"follows"),where("to","==",u.uid)),s=>{me.followers=s.size;if(view==="me")prof()},()=>{}));me.following.forEach(t=>setDoc(doc(D,"follows",u.uid+"_"+t),{from:u.uid,to:t}).catch(()=>{}));uns.push(onSnapshot(query(collection(D,"videos"),orderBy("createdAt","desc")),q=>{posts=q.docs.map(x=>({id:x.id,...x.data()}));paint()},e=>saveErr(e,"التحميل")))}
paint()}))}

/* ===== الخلاصة ===== */
const feed=$("#feed");
const io=new IntersectionObserver(es=>es.forEach(en=>{const el=en.target,v=el.querySelector("video");clearTimeout(el._t);if(en.intersectionRatio>.6)el._t=setTimeout(()=>countView(el.dataset.id),1500);if(!v)return;
if(en.intersectionRatio>.6){v.play().catch(()=>{v.muted=true;v.play().catch(()=>{})})}else{v.pause();v.currentTime=0}}),{root:feed,threshold:[0,.6]});
const postHtml=p=>{const liked=(p.likedBy||[]).includes(me.uid),mine=p.authorUid===me.uid,fol=me.following.includes(p.authorUid);
const m=isVid(p)?`<video src="${esc(p.mediaUrl)}" poster="${esc(p.thumb||"")}" loop playsinline preload="metadata"></video>`:`<img class="md" src="${esc(p.mediaUrl)}" alt="">`;
return`<article class="post" data-id="${esc(p.id)}">${m}<div class="shade"></div><div class="side">
<div class="fa ${mine||fol?"done":""}"><span data-a="pf">${av(p.author,p.avatar)}</span><i data-a="fl">${ic("plus")}</i></div>
<button data-a="lk" class="${liked?"on":""}">${ic("heart")}<span class="n">${nl(p)}</span></button>
<button data-a="cm">${ic("chat")}<span class="c">${(p.comments||[]).length}</span></button>
<button data-a="sh">${ic("share")}مشاركة</button><div class="vw">${ic("eye")}<span class="v">${p.views||0}</span></div></div>
<div class="info"><b data-a="pf" style="pointer-events:auto">${esc(p.author)}</b><p>${esc(p.caption)}</p><small>${esc(p.tags)}</small></div></article>`};
const list=()=>tab==="fol"?posts.filter(p=>me.following.includes(p.authorUid)):posts;
function paint(){if(!me)return;const l=list(),key=tab+l.map(p=>p.id).join();
if(key!==shown){shown=key;const t=feed.scrollTop;feed.innerHTML=l.length?l.map(postHtml).join(""):`<div class="empty">${ic("user")}<b>${tab==="fol"?"لا تتابع أحداً بعد":"لا توجد منشورات بعد"}</b><span>${tab==="fol"?"تابع صنّاع المحتوى ليظهروا هنا":"اضغط زر + وانشر أول فيديو"}</span></div>`;feed.scrollTop=t;$$(".post").forEach(e=>io.observe(e))}
else l.forEach(p=>{const el=feed.querySelector(`[data-id="${CSS.escape(p.id)}"]`);if(!el)return;
el.querySelector('[data-a=lk]').classList.toggle("on",(p.likedBy||[]).includes(me.uid));el.querySelector(".n").textContent=nl(p);el.querySelector(".c").textContent=(p.comments||[]).length;el.querySelector(".v").textContent=p.views||0;
el.querySelector(".fa").classList.toggle("done",p.authorUid===me.uid||me.following.includes(p.authorUid))});
if(cur&&byId(cur))cmList();
if(view==="explore")exp();if(view==="me")prof();if(ou&&!$("#user").classList.contains("hide"))userView()}
async function like(p,force){const l=(p.likedBy||[]).includes(me.uid);if(force&&l)return;const pb=p.likedBy,pc=p.likesCount;
p.likedBy=l?pb.filter(x=>x!==me.uid):[...(pb||[]),me.uid];p.likesCount=nl({likedBy:pb,likesCount:pc})+(l?-1:1);paint();
try{await updateDoc(doc(D,"videos",p.id),{likedBy:l?arrayRemove(me.uid):arrayUnion(me.uid),likesCount:increment(l?-1:1)})}catch(e){p.likedBy=pb;p.likesCount=pc;paint();saveErr(e,"الإعجاب")}}
async function tf(uid){if(!uid||uid===me.uid)return;const f=me.following.includes(uid);me.following=f?me.following.filter(x=>x!==uid):[...me.following,uid];if(ou&&ou.uid===uid)ou.fc=Math.max(0,ou.fc+(f?-1:1));paint();toast(f?"تم إلغاء المتابعة":"تمت المتابعة");
try{await setDoc(doc(D,"users",me.uid),{following:me.following},{merge:true});const r=doc(D,"follows",me.uid+"_"+uid);if(f)await deleteDoc(r);else await setDoc(r,{from:me.uid,to:uid})}catch(e){saveErr(e,"المتابعة")}}
const follow=p=>tf(p.authorUid);
function countView(id){if(seen.has(id)||!me)return;const p=byId(id);if(!p)return;seen.add(id);p.views=(p.views||0)+1;paint();updateDoc(doc(D,"videos",id),{views:increment(1)}).catch(()=>{})}
feed.onclick=e=>{const art=e.target.closest(".post");if(!art)return;const p=byId(art.dataset.id),a=e.target.closest("[data-a]");if(!p)return;
if(a){const k=a.dataset.a;if(k==="lk")like(p);else if(k==="fl")follow(p);else if(k==="pf")openUser(p.authorUid,p.author,p.avatar);else if(k==="cm"){cur=p.id;$("#cs").classList.remove("hide");cmList()}
else if(k==="sh"){const d={title:"One Look",text:p.caption||"",url:location.href};navigator.share?navigator.share(d).catch(()=>{}):navigator.clipboard?.writeText(d.url).then(()=>toast("تم نسخ الرابط"))}return}
const n=Date.now();if(n-last<300){like(p,true);const r=art.getBoundingClientRect(),s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("class","ic pop");s.style.left=e.clientX-r.left+"px";s.style.top=e.clientY-r.top+"px";s.innerHTML='<use href="#i-heart"/>';art.appendChild(s);setTimeout(()=>s.remove(),700)}
else{const v=art.querySelector("video");if(v)v.paused?v.play():v.pause()}last=n};
$("#tabs").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;tab=b.dataset.t;$$("#tabs button").forEach(x=>x.classList.toggle("on",x===b));paint()};

/* ===== التعليقات ===== */
function cmList(){const p=byId(cur);if(!p)return;const c=p.comments||[];$("#cn").textContent=c.length+" تعليق";
$("#cl2").innerHTML=c.length?c.map(x=>`<div class="cm1">${av(x.author)}<div><b>${esc(x.author)}</b><p>${esc(x.text)}</p></div></div>`).join(""):`<div class="empty">لا توجد تعليقات بعد</div>`}
$("#cb").onclick=async()=>{const t=$("#ci").value.trim(),p=byId(cur);if(!t||!p)return;const c={author:me.username,authorUid:me.uid,text:t.slice(0,300),ts:Date.now()};
p.comments=[...(p.comments||[]),c];$("#ci").value="";cmList();paint();
try{await updateDoc(doc(D,"videos",p.id),{comments:arrayUnion(c)})}catch(e){p.comments=p.comments.filter(x=>x!==c);cmList();paint();saveErr(e,"التعليق")}};
$("#ci").onkeydown=e=>{if(e.key==="Enter")$("#cb").click()};
$$(".sheet").forEach(s=>s.onclick=e=>{if(e.target===s||e.target.closest("[data-x]"))s.classList.add("hide")});

/* ===== استكشاف وملف شخصي ===== */
const cell=p=>`<div class="cell" data-o="${esc(p.id)}">${p.thumb?`<img src="${esc(p.thumb)}" alt="">`:isVid(p)?`<video src="${esc(p.mediaUrl)}#t=0.5" muted playsinline preload="metadata"></video>`:`<img src="${esc(p.mediaUrl)}" alt="">`}<span>${ic("play")}${p.views||0}</span></div>`;
function people(q){const m={...allUsers};posts.forEach(p=>{if(p.authorUid&&!m[p.authorUid])m[p.authorUid]={username:p.author,avatar:p.avatar}});return Object.entries(m).filter(([k,u])=>(u.username||"").toLowerCase().includes(q)).slice(0,20)}
async function loadUsers(){if(Date.now()-ul<60000)return;ul=Date.now();try{const s=await getDocs(collection(D,"users"));allUsers={};s.forEach(d=>{const x=d.data();allUsers[d.id]={username:x.username||"",avatar:x.avatar||""}});if(view==="explore")exp()}catch(e){}}
function exp(){const q=$("#q").value.trim().toLowerCase().replace(/^@/,"");const l=q?posts.filter(p=>[p.caption,p.tags,p.author].join(" ").toLowerCase().includes(q)):posts;
$("#pp").innerHTML=q?people(q).map(([k,u])=>`<div class="pr" data-u="${esc(k)}">${av(u.username,u.avatar)}<b>${esc(u.username)}</b></div>`).join(""):"";
$("#eg").innerHTML=l.length?l.map(cell).join(""):`<div class="empty" style="grid-column:1/-1">لا توجد نتائج</div>`}
$("#pp").onclick=e=>{const r=e.target.closest("[data-u]");if(!r)return;const k=r.dataset.u,u=allUsers[k]||{},p=posts.find(x=>x.authorUid===k);openUser(k,u.username||p?.author,u.avatar||p?.avatar)};
$("#q").oninput=exp;
function prof(){const mine=posts.filter(p=>p.authorUid===me.uid),likes=mine.reduce((a,p)=>a+nl(p),0);
$("#me").innerHTML=`<div class="pf">${av(me.username,me.avatar)}<h1 style="margin-top:10px;direction:ltr">${esc(me.username)}</h1>
<div class="st"><div><b>${mine.length}</b><small>منشوراتي</small></div><div><b>${me.followers||0}</b><small>متابعون</small></div><div><b>${me.following.length}</b><small>أتابعهم</small></div><div><b>${likes}</b><small>الإعجابات</small></div></div>
<div class="row"><button class="sm" id="en">${ic("edit")}الاسم</button><button class="sm" id="ea">${ic("up")}الصورة</button><button class="sm" id="lo">${ic("out")}خروج</button></div></div>
<div class="grid">${mine.map(cell).join("")}</div>`}
$("#me").onclick=e=>{const b=e.target.closest("button");if(b?.id==="lo")signOut(A);else if(b?.id==="ea")$("#avf").click();else if(b?.id==="en"){const n=clean(prompt("اسم المستخدم الجديد (إنجليزي)",me.username.slice(1)));if(n.length<3)return toast("الاسم قصير أو غير صالح");setProfile({username:"@"+n})}else open(e)};
$("#eg").onclick=open;
function open(e){const c=e.target.closest("[data-o]");if(!c)return;tab="all";go2("feed");paint();feed.querySelector(`[data-id="${CSS.escape(c.dataset.o)}"]`)?.scrollIntoView()}
async function openUser(uid,name,avatar){if(!uid)return toast("لا يمكن فتح هذا الحساب");if(uid===me.uid)return go2("me");ou={uid,name:name||"@user",avatar:avatar||"",fc:0,fg:null};userView();$("#user").classList.remove("hide");$("#tabs").classList.add("hide");
try{ou.fc=(await getDocs(query(collection(D,"follows"),where("to","==",uid)))).size}catch(e){}
try{const s=await getDoc(doc(D,"users",uid));if(s.exists()){const d=s.data();ou.fg=(d.following||[]).length;ou.name=d.username||ou.name;ou.avatar=d.avatar||ou.avatar}}catch(e){}
userView()}
function userView(){const mine=posts.filter(p=>p.authorUid===ou.uid),likes=mine.reduce((a,p)=>a+nl(p),0),f=me.following.includes(ou.uid);
$("#user").innerHTML=`<button class="bk" data-bk aria-label="رجوع">${ic("back")}</button><div class="pf">${av(ou.name,ou.avatar)}<h1 style="margin-top:10px;direction:ltr">${esc(ou.name)}</h1>
<div class="st"><div><b>${mine.length}</b><small>منشورات</small></div><div><b>${ou.fc}</b><small>متابعون</small></div>${ou.fg==null?"":`<div><b>${ou.fg}</b><small>يتابع</small></div>`}<div><b>${likes}</b><small>الإعجابات</small></div></div>
<div class="row"><button class="sm" data-f style="${f?"":"background:var(--r)"}">${f?"إلغاء المتابعة":"متابعة"}</button></div></div><div class="grid">${mine.map(cell).join("")}</div>`}
$("#user").onclick=e=>{if(e.target.closest("[data-bk]")){$("#user").classList.add("hide");$("#tabs").classList.toggle("hide",view!=="feed")}else if(e.target.closest("[data-f]"))tf(ou.uid);else open(e)};
async function setProfile(d){try{await setDoc(doc(D,"users",me.uid),d,{merge:true});const s=await getDocs(query(collection(D,"videos"),where("authorUid","==",me.uid)));
const up={author:d.username||me.username,avatar:d.avatar??me.avatar};await Promise.all(s.docs.map(x=>updateDoc(x.ref,up)));toast("تم الحفظ")}catch(e){saveErr(e,"الملف الشخصي")}}
$("#avf").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=160;const s=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);setProfile({avatar:c.toDataURL("image/jpeg",.8)})};im.src=URL.createObjectURL(f);e.target.value=""};

/* ===== التنقل والنشر ===== */
function go2(v){view=v;$("#user").classList.add("hide");["feed","explore","me"].forEach(x=>$("#"+x).classList.toggle("hide",x!==v));$("#tabs").classList.toggle("hide",v!=="feed");
$$("nav [data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v));if(v!=="feed")$$("video").forEach(x=>x.pause());if(v==="explore")loadUsers();paint()}
$$("nav [data-v]").forEach(b=>b.onclick=()=>go2(b.dataset.v));
$("#plus").onclick=()=>{$("#pm").textContent="";$("#us").classList.remove("hide")};
$("#sg").onclick=e=>{const x=e.target.closest("[data-m]");if(!x)return;mode=x.dataset.m;$$("#sg button").forEach(y=>y.classList.toggle("on",y===x));$("#fi").classList.toggle("hide",mode!=="file");$("#ur").classList.toggle("hide",mode==="file");$("#ur").placeholder=mode==="vurl"?"https://example.com/video.mp4":"https://example.com/photo.jpg"};
const thumb=f=>new Promise(r=>{if(!f.type.startsWith("video"))return r("");const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="metadata";v.src=URL.createObjectURL(f);v.onloadeddata=()=>{v.currentTime=Math.min(1,(v.duration||2)/2)};
v.onseeked=()=>{try{const c=document.createElement("canvas");c.width=270;c.height=Math.round(270*v.videoHeight/v.videoWidth)||480;c.getContext("2d").drawImage(v,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.7))}catch(e){r("")}};v.onerror=()=>r("");setTimeout(()=>r(""),6000)});
$("#pub").onclick=async()=>{const pm=$("#pm"),b=$("#pub");let f=null,u="";
if(mode==="file"){f=$("#fi").files[0];if(!f)return toast("اختر فيديو أو صورة");if(f.size>60e6)return toast("الحد الأقصى 60 ميغابايت")}
else{u=$("#ur").value.trim();if(!/^https?:\/\/\S+$/i.test(u))return toast("الصق رابطاً صحيحاً يبدأ بـ https");if(/youtube\.com|youtu\.be|tiktok\.com|instagram\.com|facebook\.com/i.test(u))return toast("هذا رابط صفحة وليس ملفاً مباشراً، استخدم رابط ملف .mp4 أو صورة مباشر")}
b.disabled=true;
try{let x;if(f){const t=uploadBytesResumable(ref(S,`videos/${me.uid}/${Date.now()}_${f.name.replace(/[^\w.]/g,"_")}`),f);
t.on("state_changed",s=>pm.textContent="جارٍ الرفع "+Math.round(s.bytesTransferred/s.totalBytes*100)+"%");await t;
x={mediaUrl:await getDownloadURL(t.snapshot.ref),mediaType:f.type.startsWith("video")?"video":"image",thumb:await thumb(f)}}
else x={mediaUrl:u,mediaType:mode==="vurl"?"video":"image"};
await addDoc(collection(D,"videos"),{author:me.username,authorUid:me.uid,avatar:me.avatar,caption:$("#cap").value.trim(),tags:$("#tg").value.trim(),likesCount:0,likedBy:[],comments:[],views:0,createdAt:serverTimestamp(),...x});
$("#us").classList.add("hide");$("#fi").value=$("#ur").value=$("#cap").value=$("#tg").value="";pm.textContent="";toast("تم النشر");go2("feed")}
catch(e){pm.textContent="";saveErr(e,"المنشور")}finally{b.disabled=false}};
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
